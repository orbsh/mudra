[package]
name = "mudrad"
edition.workspace = true
version.workspace = true
description = "mudra daemon: chromium spawn/CDP/lifecycle + control HTTP/WS + NestStorage receiver"

[dependencies]
mudra-store = { path = "../mudra-store" }
tag-forest = { path = "../tag-forest" }
okm-core = { workspace = true, features = ["fjall"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
# blocking sync CDP round trips (the `screenshot` seam — hover-shot must
# not need the async daemon); same 0.26 tokio-tungstenite already pulls,
# so no extra compilation
tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true
kdl.workspace = true
libc.workspace = true
# the extension wire protocol + host half — git source, declared at the
# workspace level like okm; mudra owns the event model and the verb surface,
# the crates own the pipe
induction-protocol.workspace = true
induction-host.workspace = true

[dev-dependencies]
tempfile = "3"

# the live-test guest: a bin of the package so cargo builds it for the
# integration test and exports CARGO_BIN_EXE_… (never a stale fixture)
[[bin]]
name = "induction_guest_fixture"
path = "tests/fixtures/induction_guest_fixture.rs"
test = false
doc = false

[lints]
workspace = true
