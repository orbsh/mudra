[package]
name = "tag-forest"
edition.workspace = true
version.workspace = true
description = "tag-forest UI primitives as render-to-string (no DOM) — one crate, two render entries: mudrad SSR (capsule HTML for the extension bar) and the R2 leptos panel"

[dependencies]
# interactive bindings are opt-in: mudrad's SSR path (and any non-leptos
# host) never links the UI framework; only the wasm panel turns this on
leptos = { workspace = true, optional = true }

[features]
leptos = ["dep:leptos"]

[lints]
workspace = true
