[package]
name = "mudra-panel"
edition.workspace = true
version.workspace = true
description = "mudra console panel: leptos CSR wasm over the bare NestStorage WS frame protocol (R2)"

[dependencies]
# schema layer only — no fjall on the wasm target (engine = default feature
# of mudra-store pulls it; the panel speaks bytes, mudrad owns semantics).
mudra-store = { path = "../mudra-store", default-features = false }
tag-forest = { path = "../tag-forest", features = ["leptos"] }
# frame codec: OpFrame/OpResponse over one-Vec<u8>-per-frame WS transport
okm-wire = { workspace = true }
# `localstorage` = ADR-0028's consumer half: panel-local UI state rides the
# SYNC LocalStorageStore (business data stays on the wire/verb path).
okm-core = { workspace = true, features = ["localstorage"] }
leptos.workspace = true
gloo-net.workspace = true
serde.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true
web-time.workspace = true
serde_json.workspace = true

[dev-dependencies]
# contract tests (native) need the engine assembly side: dev-dependencies
# may raise mudra-store's feature set without touching the wasm build.
mudra-store = { path = "../mudra-store" }
tempfile = "3"

[lints]
workspace = true
